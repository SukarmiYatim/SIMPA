
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | SIPMA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body class="login">

    <!-- SPRITE IKON -->
    <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <symbol id="i-cap" viewBox="0 0 24 24">
        <path d="m2 9 10-5 10 5-10 5z" />
        <path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5M22 9v6" />
      </symbol>

      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>

      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M3 3l18 18" />
        <path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1.1" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </symbol>

      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
      </symbol>

      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </symbol>
    </svg>

    <!-- HEADER -->
    <header class="login__bar">
      <a class="brand" href="index.html">
        <span class="brand__logo">
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="#i-cap" />
          </svg>
        </span>

        <span class="brand__text">
          <span class="brand__name">SIPMA</span>
          <span class="brand__sub">
            Sistem Informasi Pemantauan Akademik<br />
            Klasifikasi Risiko Keterlambatan Studi
          </span>
        </span>
      </a>
    </header>

    <!-- FORM LOGIN -->
    <main class="login__main">
      <section class="login__card" aria-labelledby="judul-login">

        <span class="login__logo">
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="#i-cap" />
          </svg>
        </span>

        <div class="login__intro">
          <h1 id="judul-login">Selamat Datang!</h1>
          <p>Masuk untuk mengakses Sistem Pemantauan Akademik</p>
        </div>

        <form class="login__form" data-login data-demo-redirect="admin/beranda.html">

          <!-- PILIHAN PERAN -->
          <fieldset class="role-picker">
            <legend class="sr-only">Masuk sebagai</legend>

            <input class="role-picker__input" type="radio" name="peran"
              id="peran-admin" value="admin"
              data-home="admin/beranda.html" checked />
            <label class="role-picker__label" for="peran-admin">Admin</label>

            <input class="role-picker__input" type="radio" name="peran"
              id="peran-dosen" value="dosen"
              data-home="dosen/beranda.html" />
            <label class="role-picker__label" for="peran-dosen">Dosen PA</label>

            <input class="role-picker__input" type="radio" name="peran"
              id="peran-mahasiswa" value="mahasiswa"
              data-home="mahasiswa/beranda.html" />
            <label class="role-picker__label" for="peran-mahasiswa">Mahasiswa</label>
          </fieldset>

          <!-- EMAIL -->
          <div class="field">
            <label class="field__label" for="email">Email</label>

            <span class="input-icon">
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-mail" />
              </svg>

              <input class="input" id="email" name="email"
                type="email" autocomplete="username" required />
            </span>
          </div>

          <!-- PASSWORD -->
          <div class="field">
            <label class="field__label" for="password">Password</label>

            <span class="input-icon">
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-lock" />
              </svg>

              <input class="input" id="password" name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                 required />

              <button class="input-icon__btn eye" type="button"
                data-toggle-password="password"
                aria-label="Tampilkan password"
                aria-pressed="false">

                <svg class="icon eye__show" aria-hidden="true" focusable="false">
                  <use href="#i-eye" />
                </svg>

                <svg class="icon eye__hide" aria-hidden="true" focusable="false">
                  <use href="#i-eye-off" />
                </svg>
              </button>
            </span>

            <!-- LUPA PASSWORD -->
            <a class="auth-link auth-link--end auth-only"
              href="#" data-open-reset>
              Lupa Password?
            </a>
          </div>

          <button class="btn btn--block" type="submit">Login</button>
        </form>

        <p class="auth-switch auth-only">
          Belum punya akun?
          <a class="auth-link" href="daftar.html">Daftar Sekarang</a>
        </p>

      </section>
    </main>

    <!-- ================================= -->
    <!-- POP-UP RESET PASSWORD -->
    <!-- ================================= -->

    <div class="reset-overlay" id="reset-overlay" hidden>

      <section class="reset-modal">

        <div class="reset-modal__icon">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">

            <rect x="3" y="10" width="18" height="12" rx="2" />
            <path d="M7 10V6a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <div class="reset-modal__heading">
          <h2>Reset Password</h2>
          <p>Masukkan Email Terdaftar dan Password Baru Anda</p>
        </div>

        <form id="reset-form" class="reset-modal__form">

          <div class="field">
            <label class="field__label" for="reset-email">
              Email Terdaftar
            </label>

            <input class="input" type="email"
              id="reset-email" required />
          </div>

          <div class="field">
            <label class="field__label" for="reset-password">
              Password Baru
            </label>

            <input class="input" type="password"
              id="reset-password" minlength="8" required />
          </div>

          <div class="field">
            <label class="field__label" for="reset-confirm">
              Konfirmasi Password Baru
            </label>

            <input class="input" type="password"
              id="reset-confirm" minlength="8" required />
          </div>

          <button class="reset-modal__submit" type="submit">
            Reset Password
          </button>

        </form>

        <button class="reset-modal__back"
          type="button" data-close-reset>
          Kembali
        </button>

      </section>
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>

  </body>
</html>
