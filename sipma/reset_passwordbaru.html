
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Baru | SIPMA</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <section class="auth-card auth-card--reset">

      <div class="auth-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="10" width="16" height="12" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>

      <div class="auth-heading">
        <h1>Buat Password Baru</h1>
        <p>Silakan masukkan password baru untuk akun Anda.</p>
      </div>

      <form id="new-password-form" class="auth-form">

        <div class="field">
          <label class="field__label" for="password-baru">
            Password Baru
          </label>
          <input class="input" type="password" id="password-baru"
            minlength="8" required>
        </div>

        <div class="field">
          <label class="field__label" for="password-baru-konfirmasi">
            Konfirmasi Password Baru
          </label>
          <input class="input" type="password"
            id="password-baru-konfirmasi"
            data-match="password-baru" required>
        </div>

        <button class="btn btn--block" type="submit">
          Simpan Password Baru
        </button>

      </form>

      <a href="index.html" class="auth-back">
        Kembali ke Login
      </a>

    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
