
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SIPMA</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>

<body class="reset-page">

  <main class="reset-container">
    <section class="reset-card">

      <div class="reset-icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <rect x="3" y="10" width="18" height="12" rx="2"/>
          <path d="M7 10V6a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <div class="reset-heading">
        <h1>Reset Password</h1>
        <p>Masukkan Email Terdaftar dan Password Baru Anda</p>
      </div>

      <form class="reset-form" id="reset-form">

        <div class="field">
          <label class="field__label" for="email-reset">
            Email Terdaftar
          </label>
          <input
            class="input"
            type="email"
            id="email-reset"
            name="email"
            required
          >
        </div>

        <div class="field">
          <label class="field__label" for="password-baru">
            Password Baru
          </label>
          <input
            class="input"
            type="password"
            id="password-baru"
            name="password_baru"
            minlength="8"
            required
          >
        </div>

        <div class="field">
          <label class="field__label" for="konfirmasi-password">
            Konfirmasi Password Baru
          </label>
          <input
            class="input"
            type="password"
            id="konfirmasi-password"
            name="konfirmasi_password"
            minlength="8"
            required
          >
        </div>

        <button class="btn btn--block reset-button" type="submit">
          Reset Password
        </button>

      </form>

      <a href="index.html" class="reset-back">
        Kembali
      </a>

    </section>
  </main>

  <script>
    const resetForm = document.getElementById("reset-form");

    resetForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("password-baru").value;
      const konfirmasi = document.getElementById("konfirmasi-password").value;

      if (password !== konfirmasi) {
        alert("Konfirmasi password tidak sesuai!");
        return;
      }

      alert("Password berhasil divalidasi. Fitur penyimpanan password perlu dihubungkan ke backend.");
    });
  </script>

</body>
</html>
